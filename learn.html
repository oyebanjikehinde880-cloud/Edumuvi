<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edumuvi - Learn</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0f4c81;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
max-width:500px;
margin:25px auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
text-align:center;
}

h2{
color:#0f4c81;
margin-bottom:10px;
}

p{
font-size:17px;
margin-bottom:20px;
color:#555;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:#0f4c81;
color:white;
}

button:hover{
background:#08345c;
}

</style>

</head>

<body>

<header>EDUMUVI</header>

<div class="container">

<div class="card">

<h2 id="topicName"></h2>

<p>
Choose how you want to learn this topic.
</p>

<button onclick="openNotes()">
📖 Learn by Notes
</button>

<button onclick="openMusic()">
🎵 Learn by Music
</button>

<button onclick="openVideo()">
🎬 Learn by Movies
</button>

<button onclick="openQuiz()">
📝 Take Quiz
</button>

</div>

</div>

<script>

let topic = localStorage.getItem("topic");

if(!topic){
topic="Selected Topic";
}

document.getElementById("topicName").innerHTML=topic;

function openNotes(){

window.location.href="notes.html";

}

function openMusic(){

window.open(
"https://suno.com",
"_blank"
);

}

function openVideo(){

let search=encodeURIComponent(topic+" educational lesson");

window.open(
"https://www.youtube.com/results?search_query="+search,
"_blank"
);

}

function openQuiz(){

window.location.href="test.html";

}

</script>

</body>
</html>
